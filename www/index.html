<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42 Web Server</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 600px;
        }
        h1 {
            font-size: 3em;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .number {
            font-size: 8em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        p {
            font-size: 1.2em;
            margin: 10px 0;
            opacity: 0.9;
        }
        .info {
            margin-top: 30px;
            font-size: 0.9em;
            opacity: 0.7;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to</h1>
        <div class="number">42</div>
        <p>Web Server</p>
        <p>A simple HTTP server implementation</p>
        <div class="info">
            <p>Server is running successfully!</p>
            <p>Built with C for 42 School</p>
        </div>
    </div>
</body>
</html>
